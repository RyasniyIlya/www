name: Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Force Tailwind Oxide for Linux
        run: pnpm add -D @tailwindcss/oxide-linux-x64-gnu

      - name: Run build
        run: pnpm run build

      - name: Run format
        run: pnpm run format:check:all

      - name: Run lint
        run: pnpm run lint:all