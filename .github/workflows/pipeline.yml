name: Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      # 1. Завантажуємо код
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Налаштовуємо офіційний PNPM
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 3. Налаштовуємо Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # 4. Встановлюємо залежності
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 5. ХИТРИЙ ТРЮК: Якщо Tailwind Oxide все одно не знайшовся, примусово ставимо його версію для Linux
      - name: Force install Tailwind Oxide for Linux
        run: pnpm add -D @tailwindcss/oxide-linux-x64-gnu

      # 6. Запуск збірки проекту
      - name: Run build
        run: pnpm run build

      # 7. Автоматично рівняємо відступи
      - name: Fix and check formatting
        run: |
          pnpm run format:all || npx prettier --write .
          npx prettier --check .

      # 8. Перевірка лінтера
      - name: Run lint
        run: pnpm run lint:all