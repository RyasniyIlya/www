name: Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      # 1. Завантажуємо код проекту на сервер (оновили до актуальної v4)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Налаштовуємо Node.js (оновили до актуальної v4)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 3. Встановлюємо пакетний менеджер pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # 4. Встановлюємо залежності (додали прапорець, щоб pnpm точно завантажив бінарники Tailwind)
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 5. Виправили: запускаємо збірку саме через pnpm, а не npm!
      - name: Run build
        run: pnpm run build

      # 6. Перевірка форматування коду через pnpm
      - name: Run format
        run: pnpm run format:check:all

      # 7. Перевірка лінтера (ESLint) через pnpm
      - name: Run lint
        run: pnpm run lint:all